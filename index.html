<!doctype html>
<!-- D:\gansu\gansu-english-app\index.html -->
<!-- 这是整个网站唯一的 HTML 文件，Vite 会以它为“入口”去加载 src/main.js，再把 Vue 组件渲染到下面的 #app 里 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 是给手机用的：让页面能延伸到刘海屏/圆角的区域，配合后面的 safe-area 内边距 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 手机浏览器地址栏/状态栏的主题色，跟项目主色一致，看起来更像 App -->
    <meta name="theme-color" content="#1f7263" />
    <meta name="description" content="甘肃专升本英语单词通：3500 词高频词库、卡片记忆、四选一测验、错题本，学习进度自动保存在本地。" />
    <!-- 浏览器标签页上的小图标。这里直接用一段 SVG 代码当图标，省得你再去找图片文件，也不会因为缺图标在控制台报 404 -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f7263'/%3E%3Ctext x='50' y='70' font-size='54' font-family='sans-serif' text-anchor='middle' fill='%23ffffff'%3EE%3C/text%3E%3C/svg%3E"
    />
    <!-- 页面标题：浏览器标签页和你分享给别人时看到的名称 -->
    <title>甘肃专升本英语单词通</title>
    <script type="module" crossorigin src="/gansu-english-app/assets/index-BLnXsrt3.js"></script>
    <link rel="stylesheet" crossorigin href="/gansu-english-app/assets/index-Droj_Z3w.css">
  </head>
  <body>
    <!-- Vue 渲染出来的界面，全部会被塞进这个 div 里 -->
    <div id="app"></div>
    <!-- type="module" 表示用现代 JS 模块语法加载；src 指向真正的程序入口 -->
  </body>
</html>
